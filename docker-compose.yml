services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: astrotask
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://postgres@postgres:5432/astrotask
      JWT_SECRET: demo-jwt-secret-change-me
      ENCRYPTION_KEY_32: 01234567890123456789012345678901
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
